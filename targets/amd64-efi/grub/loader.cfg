# ironflockos-boot-loader-version: 1
# IronFlockOS boot loader (ADR-0022): grub.cfg on the IRONFLOCKOS partition.
# Debian's signed GRUB reads it next to itself as EFI/BOOT/grub.cfg; when that
# file cannot be opened, the same loader as EFI/debian/grub.cfg, GRUB's
# built-in prefix. GRUB takes a file it can open whatever it holds, so
# ironflockos-boot-script only ever puts a whole file in either place, by a
# rename, and the other path first. The loader changes rarely; the boot is
# the boot script's, next to it in EFI/BOOT:
#
#   boot.cfg       the script in use (targets/amd64-efi/grub/boot.cfg): the
#                  slot, the kernel command line, the screen, the menu
#   boot-next.cfg  a newer script on trial, staged by ironflockos-boot-script
#                  once the booted slot has proven itself
#
# grubenv holds RAUC's slot state and the trial's: IRONFLOCKOS_SCRIPT_TRIAL
# (staged: boot-next.cfg waits for its trial; tried: its boot began;
# failed: that boot was not confirmed; good: confirmed, boot.cfg not replaced
# yet) and IRONFLOCKOS_SCRIPT_SLOT, the slot that staged it. The loader
# writes only tried, failed and that slot's try flag, none of which makes
# grubenv longer; ironflockos-boot-script writes the rest.
#
# Without a trial, boot.cfg runs as GRUB ran grub.cfg up to 0.17.0: its menu,
# its timeout, its fallback. When it is missing or sets no default entry, the
# last resort below boots. A staged script runs once, only on the slot that
# staged it and only while that slot is GRUB's first choice and good, so it
# never shares a boot with a slot's trial. The try is saved before the script
# runs; a boot that is not confirmed leaves it saved, the next boot runs
# boot.cfg, and the slot gets back the try that boot took.
# ironflockos-boot-script counts such a boot against the script's version
# and stages it once more: a version has two trial boots (a power cut or a
# restart in a trial boot looks the same as a failure here). In the trial's
# boot each script runs in a submenu, a menu of its own: when none of its
# entries boots, GRUB comes back here and goes on with the next choice,
# boot.cfg, then the last resort.
#
# The last resort is the kernel of the first slot of ORDER, then of the
# other, on text, so that the device comes online and the system can put the
# scripts right. Every module named below is built into Debian's signed GRUB
# (debian/build-efi-images of Debian's grub2); under Secure Boot it loads no
# others.

insmod part_gpt
insmod fat
insmod ext2
insmod loadenv
insmod configfile
insmod test
insmod regexp
insmod probe
insmod linux
insmod gzio

# grubenv and the scripts are in EFI/BOOT of the partition GRUB started from,
# whichever path it read this file from.
set prefix=($root)/EFI/BOOT

set ORDER="A B"
set A_OK=0
set A_TRY=0
set B_OK=0
set B_TRY=0
set IRONFLOCKOS_CMDLINE=""
set IRONFLOCKOS_SCRIPT_TRIAL=""
set IRONFLOCKOS_SCRIPT_SLOT=""
load_env --file ${prefix}/grubenv ORDER A_OK A_TRY B_OK B_TRY IRONFLOCKOS_CMDLINE IRONFLOCKOS_SCRIPT_TRIAL IRONFLOCKOS_SCRIPT_SLOT

set ironflockos_first=""
for ironflockos_s in ${ORDER}; do
    set ironflockos_first="${ironflockos_s}"
    break
done

# The trial ended without being confirmed. The slot that ran it was proven
# and good before, so it gets back the try that boot took.
function ironflockos_trial_failed {
    set IRONFLOCKOS_SCRIPT_TRIAL=failed
    if [ "${IRONFLOCKOS_SCRIPT_SLOT}" = A ]; then
        set A_TRY=0
        save_env --file ${prefix}/grubenv IRONFLOCKOS_SCRIPT_TRIAL A_TRY
    elif [ "${IRONFLOCKOS_SCRIPT_SLOT}" = B ]; then
        set B_TRY=0
        save_env --file ${prefix}/grubenv IRONFLOCKOS_SCRIPT_TRIAL B_TRY
    else
        save_env --file ${prefix}/grubenv IRONFLOCKOS_SCRIPT_TRIAL
    fi
}

set ironflockos_trial=no
if [ "${IRONFLOCKOS_SCRIPT_TRIAL}" = staged ]; then
    set ironflockos_ready=no
    if [ "${ironflockos_first}" = A -a "${IRONFLOCKOS_SCRIPT_SLOT}" = A -a "${A_OK}" = 1 -a "${A_TRY}" = 0 ]; then
        set ironflockos_ready=yes
    fi
    if [ "${ironflockos_first}" = B -a "${IRONFLOCKOS_SCRIPT_SLOT}" = B -a "${B_OK}" = 1 -a "${B_TRY}" = 0 ]; then
        set ironflockos_ready=yes
    fi
    if [ "${ironflockos_ready}" = yes ]; then
        if [ -f ${prefix}/boot-next.cfg ]; then
            set IRONFLOCKOS_SCRIPT_TRIAL=tried
            if save_env --file ${prefix}/grubenv IRONFLOCKOS_SCRIPT_TRIAL; then
                set ironflockos_trial=yes
            fi
        fi
    fi
elif [ "${IRONFLOCKOS_SCRIPT_TRIAL}" = tried ]; then
    ironflockos_trial_failed
elif [ "${IRONFLOCKOS_SCRIPT_TRIAL}" = good ]; then
    set ironflockos_trial=yes
fi

# The last resort's slots and command line (the entries are at the end).
regexp --set=1:ironflockos_disk '^([^,]+),' "${root}"
if [ "${ironflockos_first}" = B ]; then
    set ironflockos_one=B
    set ironflockos_one_part=gpt3
    set ironflockos_two=A
    set ironflockos_two_part=gpt2
else
    set ironflockos_one=A
    set ironflockos_one_part=gpt2
    set ironflockos_two=B
    set ironflockos_two_part=gpt3
fi
set ironflockos_text="rw rootwait panic=10 fsck.repair=yes systemd.gpt_auto=0 ironflockos.boot_script=0 @CONSOLE_CMDLINE@ plymouth.enable=0 ${IRONFLOCKOS_CMDLINE}"

if [ "${ironflockos_trial}" = yes ]; then
    # Entries 0 and 1, then the last resort as 2 and 3. Nothing is drawn and
    # nothing waits here: each script sets its own menu's timeout.
    submenu "IronFlockOS, boot script on trial" --id ironflockos-next {
        source ${prefix}/boot-next.cfg
    }
    submenu "IronFlockOS" --id ironflockos {
        load_env --file ${prefix}/grubenv IRONFLOCKOS_SCRIPT_TRIAL IRONFLOCKOS_SCRIPT_SLOT
        if [ "${IRONFLOCKOS_SCRIPT_TRIAL}" = tried ]; then
            ironflockos_trial_failed
        fi
        source ${prefix}/boot.cfg
    }
    set default=0
    set fallback="1 2 3"
    set timeout_style=hidden
    set timeout=0
else
    unset default
    source ${prefix}/boot.cfg
    # Nothing set up a boot: the menu has only the last resort.
    if [ -z "${default}" ]; then
        set default=0
        set fallback=1
        set timeout=0
    fi
fi

menuentry "IronFlockOS slot ${ironflockos_one}, last resort" --id ironflockos-last-resort-1 {
    probe --set=ironflockos_uuid --part-uuid "${ironflockos_disk},${ironflockos_one_part}"
    linux (${ironflockos_disk},${ironflockos_one_part})/vmlinuz root=PARTUUID=${ironflockos_uuid} rauc.slot=${ironflockos_one} ${ironflockos_text}
    initrd (${ironflockos_disk},${ironflockos_one_part})/initrd.img
}
menuentry "IronFlockOS slot ${ironflockos_two}, last resort" --id ironflockos-last-resort-2 {
    probe --set=ironflockos_uuid --part-uuid "${ironflockos_disk},${ironflockos_two_part}"
    linux (${ironflockos_disk},${ironflockos_two_part})/vmlinuz root=PARTUUID=${ironflockos_uuid} rauc.slot=${ironflockos_two} ${ironflockos_text}
    initrd (${ironflockos_disk},${ironflockos_two_part})/initrd.img
}
# end of the IronFlockOS boot loader
