# RAUC system configuration of IronFlockOS on Jetson Orin (ADR-0006, ADR-0008;
# master plan section 3.5). @COMPATIBLE@ is filled in by the build.
#
# NVIDIA's rootfs A/B: the root slots are the APP and APP_b partitions of
# the layout flashed with ROOTFS_AB=1. /usr/lib/ironflockos/tegra-rootfs-ab
# (WP-6.3) sets the slot to boot through nvbootctrl -t rootfs and NVIDIA's
# RootfsStatusSlotA/B variables; NVIDIA's firmware falls back after three warm
# boots nobody verified, and /usr/lib/ironflockos/tegra-slot-trial makes that
# mean "the device-agent has not marked the updated slot good"
# (docs/targets/jetson-orin.md, "A/B with nvbootctrl").
[system]
compatible=@COMPATIBLE@
bootloader=custom
data-directory=/data/rauc
bundle-formats=verity
max-bundle-download-size=8589934592

[keyring]
path=/etc/rauc/keyring.pem
use-bundle-signing-time=true
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/lib/ironflockos/tegra-rootfs-ab
# Carries the device's identity (machine-id, hostname) into the slot just
# written.
post-install=/usr/lib/ironflockos/rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/APP
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/APP_b
type=ext4
bootname=B
