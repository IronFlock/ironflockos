# NVIDIA Jetson Linux BSP of the jetson-orin target (ADR-0008; WP-6.1).
# Plain KEY=value data, read by build/fetch-bsp.sh.
#
# Jetson Linux r39.2.1 (JetPack 7.2.1, 2026-08-11), Ubuntu 24.04, kernel
# 6.8.12. The tarball carries the flash tools, the partition layouts, the
# bootloader binaries and capsule generation; the root filesystem's L4T
# packages come from NVIDIA's apt repositories at the same version.
L4T_VERSION=39.2.1
BSP_URL=https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/Jetson_Linux_R39.2.1_aarch64.tbz2
# NVIDIA publishes SHA-1 only (release_sha_hashes.txt next to the tarball);
# the SHA-256 is this repository's pin, taken on 2026-11-05 from a download
# whose SHA-1 matched NVIDIA's list.
BSP_HASHES_URL=https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/release_sha_hashes.txt
BSP_SHA1=8fe9a3ac9a98550b6077df450441599141ba47fb
BSP_SHA256=2e5619088ba88e85dab25247f033d70659b6f676ff835176a07766dcb0fdbe6b
# NVIDIA's licence of the BSP, the NVIDIA Driver License Agreement
# (docs/jetson-licence-review.md), as NVIDIA serves it next to the tarball.
# The flash kit downloads it from there and shows it before anything of
# NVIDIA's is unpacked or run; this repository holds no copy. NVIDIA's list
# has its SHA-1; the SHA-256 is this repository's pin, taken on 2026-11-16
# from a download whose SHA-1 matched NVIDIA's list.
BSP_LICENSE_URL=https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/release/Tegra_Software_License_Agreement-Tegra-Linux.txt
BSP_LICENSE_SHA1=e331f3658ad9569817848036b6889d2bedcab18a
BSP_LICENSE_SHA256=828f46b4982622a4558a96f21f531dc5cf36d1d942255cd886be56bad3797aa4

# The source code a Jetson release mirrors to the download server, next to
# its files: ironflockos/sources/l4t-<L4T_VERSION>/<file> (build/sources.sh,
# the "l4t" lines of release/sources; docs/jetson-licence-review.md, point
# 3). Each is <NAME>_URL, <NAME>_FILE (its name in the mirror),
# <NAME>_SHA256 (this repository's pin) and <NAME>_VERSION (the source
# version of the packages it is the source of).
#
# NVIDIA's public_sources.tbz2 of Jetson Linux r39.2.1: the kernel, the
# out-of-tree modules, nvgpu, the display driver, OP-TEE, TF-A, and FreeRTOS
# V8.1.2 with NVIDIA's SPE code (FreeRTOSV8.1.2_src.tbz2,
# spe-freertos-bsp.tbz2) for the boot firmware's source offer. NVIDIA
# publishes no hash for it: the SHA-256 is this repository's pin, taken on
# 2026-11-17 from one download of 309583176 bytes from L4T_SOURCES_URL
# (SHA-1 7efedf1c5587210d78bcb9d61463f2a29d56c8e4).
L4T_SOURCES_URL=https://developer.download.nvidia.com/embedded/L4T/r39_Release_v2.1/sources/public_sources.tbz2
L4T_SOURCES_FILE=public_sources.tbz2
L4T_SOURCES_SHA256=8346f0371649a92c42293b2d4a7bf3d69e4dd1de23009e1463ea910994a81371
L4T_SOURCES_VERSION=39.2.1-20260806224157
# libnvidia-container at the tag of the container toolkit of JetPack 7.2.1
# (target.conf L4T_CONTAINER_TOOLKIT_VERSION): Apache-2.0 with LGPL-3.0
# parts (COPYING.LESSER). GitHub's archive of the tag v1.19.1; the SHA-256
# is this repository's pin, taken on 2026-11-17 from two downloads of
# 1617802 bytes (github.com and codeload.github.com) with the same hash.
LIBNVIDIA_CONTAINER_SOURCE_URL=https://github.com/NVIDIA/libnvidia-container/archive/refs/tags/v1.19.1.tar.gz
LIBNVIDIA_CONTAINER_SOURCE_FILE=libnvidia-container-1.19.1.tar.gz
LIBNVIDIA_CONTAINER_SOURCE_SHA256=98a20cb4a7e6f64bb4755d0375b383ed09ddb4e2df5061b088013cf23bd72892
LIBNVIDIA_CONTAINER_SOURCE_VERSION=1.19.1-1
