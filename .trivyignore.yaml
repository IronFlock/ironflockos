# Accepted findings of the root filesystem scans (security.yml, the harness's
# rootfs scans of every image), each with its reason and an expiry: when it
# expires the finding counts again and blocks security / report. The fix is
# the bump, not a longer expiry.
#
# A security fix is taken as soon as its package is in the vendor's
# repository and CI passes (docs/build.md, Reproducibility).

vulnerabilities:
  # docker-buildx-plugin 0.39.0 (Debian and Ubuntu builds of Docker's
  # repository) is still built with moby/go-archive 0.2.0, as is every buildx
  # release so far (go.mod of v0.39.0 and of master, 2026-11-16). The first
  # buildx build with go-archive >= 0.3.0 is taken when it is in the
  # repository. docker buildx runs on the device only when an app is built
  # locally.
  - id: CVE-2026-17106
    paths:
      - "usr/libexec/docker/cli-plugins/docker-buildx"
    statement: "moby/go-archive 0.2.0 in docker-buildx 0.39.0 (tar extraction link following); no buildx release with go-archive 0.3.0 yet"
    expired_at: 2026-12-06
  # x/net/html parser, O(n^2) on crafted input (GO-2026-6860), fixed in x/net
  # 0.62.0, which buildx 0.39.0 has; compose 5.7.1, the newest in Docker's
  # repository, is still on x/net 0.60. Trivy matches the module version only:
  # the binary does not link golang.org/x/net/html (govulncheck -mode=binary
  # finds the module, no package; go tool nm, no html symbol in compose
  # 5.7.0).
  - id: CVE-2026-78661
    paths:
      - "usr/libexec/docker/cli-plugins/docker-compose"
    statement: "golang.org/x/net < 0.62.0 in docker-compose 5.7.0, but the vulnerable package golang.org/x/net/html is not in the binary; no compose release with x/net 0.62.0 yet"
    expired_at: 2026-12-06
  # NVIDIA Container Toolkit 1.20.1 (the nvidia variant; NVIDIA's latest,
  # 2026-09-19) is built with Go 1.27.1. No release built with Go >= 1.27.3
  # exists yet; revisit with NVIDIA's next release.
  - id: CVE-2026-111943
    paths:
      - "usr/bin/nvidia-ctk"
      - "usr/bin/nvidia-container-runtime"
      - "usr/bin/nvidia-container-runtime-hook"
      - "usr/bin/nvidia-cdi-hook"
    statement: "Go 1.27.1 stdlib (crypto/x509) in NVIDIA Container Toolkit 1.20.1, NVIDIA's latest release; no fixed build yet"
    expired_at: 2026-12-06
  - id: CVE-2026-78667
    paths:
      - "usr/bin/nvidia-ctk"
      - "usr/bin/nvidia-container-runtime"
      - "usr/bin/nvidia-container-runtime-hook"
      - "usr/bin/nvidia-cdi-hook"
    statement: "Go 1.27.1 stdlib (net/http Range) in NVIDIA Container Toolkit 1.20.1, NVIDIA's latest release; no fixed build yet; they are OCI hooks and command-line tools, no network service"
    expired_at: 2026-12-06
  - id: CVE-2026-78669
    paths:
      - "usr/bin/nvidia-ctk"
      - "usr/bin/nvidia-container-runtime"
      - "usr/bin/nvidia-container-runtime-hook"
      - "usr/bin/nvidia-cdi-hook"
    statement: "Go 1.27.1 stdlib (net/http2 SETTINGS) in NVIDIA Container Toolkit 1.20.1, NVIDIA's latest release; no fixed build yet; they are OCI hooks and command-line tools, no network service"
    expired_at: 2026-12-06
  - id: CVE-2026-97031
    paths:
      - "usr/bin/nvidia-ctk"
      - "usr/bin/nvidia-container-runtime"
      - "usr/bin/nvidia-container-runtime-hook"
      - "usr/bin/nvidia-cdi-hook"
    statement: "Go 1.27.1 stdlib (crypto/tls ECH) in NVIDIA Container Toolkit 1.20.1, NVIDIA's latest release; no fixed build yet; they are OCI hooks and command-line tools, no network service"
    expired_at: 2026-12-06
